# Runs every Breeze Bedrock add-on check on Linux, Windows and macOS.
# Pushed to the branch bedrock-addon of utaib/Breeze-Client-compile by
# Breeze-Bedrock/ci/push.sh; the add-on source is in the commit before the
# tip, so the tip never holds it.
name: Breeze Bedrock add-on checks
on:
  push:
    branches: [bedrock-addon]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore the add-on source from the commit before
        shell: bash
        run: git checkout HEAD~1 -- bedrock && cat bedrock/SOURCE.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --quiet jsonschema==4.23.0
      - name: All checks
        shell: bash
        env:
          PYTHON: python
        run: bash bedrock/Breeze-Bedrock/tools/ci.sh
