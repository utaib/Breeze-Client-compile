pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
        // ForgeGradle only, asked last so the other plugins never wait on it.
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
            content { includeGroupByRegex 'net\\.minecraftforge.*' }
        }
        // MixinGradle, for Forge 1.20.2 to 1.20.4 (ForgeGradle 6).
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
            content { includeGroupByRegex 'org\\.spongepowered.*' }
        }
    }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
        // Forge and NeoForge builds (versions/forge-*, versions/neoforge-*;
        // gradle/forge.gradle). ModDevGradle, from the Gradle plugin portal.
        id 'net.neoforged.moddev' version "${moddev_version}"
        id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"
        // Forge from 1.20.6, which runs on Mojang's names: ForgeGradle 7, as
        // in Forge's own example project for those versions.
        id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    }
}

rootProject.name = 'breeze'

// Portable code, compiled once and consumed by every version.
include 'common'

// One project per Minecraft version: every folder in versions/ that has a
// gradle.properties. Each builds <version>.jar (gradle/version.gradle).
//
// Loom sets Minecraft up while configuring a project, so configuring every
// version downloads every Minecraft. To work on some of them only, name them:
//   ./gradlew -Pbreeze_versions=1.21.4,1.21.11 :versions:1.21.4:runClient
def only = startParameter.projectProperties['breeze_versions']
def wanted = only ? only.split(',').collect { it.trim() } as Set : null
def versionKey = { String v -> v.tokenize('.').collect { it.isInteger() ? String.format('%05d', it as int) : it }.join('.') }
file('versions').listFiles()
        .findAll { new File(it, 'gradle.properties').isFile() }
        .findAll { wanted == null || wanted.contains(it.name) }
        .sort { versionKey(it.name) }
        .each { dir ->
            include "versions:${dir.name}"
            project(":versions:${dir.name}").projectDir = dir
        }
