pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
        id 'net.fabricmc.fabric-loom' version "${loom_version}"
    }
}

rootProject.name = 'breeze'

// Portable code, compiled once and consumed by every version.
include 'common'

// One project per Minecraft version: every folder in versions/ that has a
// gradle.properties. Each builds <version>.jar (gradle/version.gradle).
//
// Loom sets Minecraft up while configuring a project, so configuring every
// version downloads every Minecraft. To work on some of them only, name them:
//   ./gradlew -Pbreeze_versions=1.21.4,1.21.11 :versions:1.21.4:runClient
def only = startParameter.projectProperties['breeze_versions']
def wanted = only ? only.split(',').collect { it.trim() } as Set : null
def versionKey = { String v -> v.tokenize('.').collect { it.isInteger() ? String.format('%05d', it as int) : it }.join('.') }
file('versions').listFiles()
        .findAll { new File(it, 'gradle.properties').isFile() }
        .findAll { wanted == null || wanted.contains(it.name) }
        .sort { versionKey(it.name) }
        .each { dir ->
            include "versions:${dir.name}"
            project(":versions:${dir.name}").projectDir = dir
        }
