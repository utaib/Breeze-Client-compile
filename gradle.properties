org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Configure only the projects a build asks for: each version project sets up
# its own Minecraft while being configured.
org.gradle.configureondemand=true

# Shared across every version module. Anything that differs per Minecraft
# version lives in that version's own gradle.properties, not here.
mod_version=2.9.2
maven_group=dev.breeze

# One Loom for every version (gradle/version.gradle), with the Gradle in
# gradle/wrapper. Fabric's example mod uses the same pair for 1.20.6, 1.21.11
# and 26.3 (scripts/ci/version-facts.sh).
loom_version=1.18.2
