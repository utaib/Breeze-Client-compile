# Breeze on Forge, Minecraft 1.20.6 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-15 (the build the launcher installs).
platform=forge
minecraft_version=1.20.6
loader_build=1.20.6-50.2.14
forge_toolchain=forgegradle

minecraft_range=[1.20.6,1.20.7)
loader_range=[50,)

# Forge's own Mixin (0.8.5) knows compatibility levels up to JAVA_17, so Breeze is
# compiled for Java 17; ForgeGradle uses Java 21, which this Minecraft needs.
java_release=17
mixin_java=JAVA_17
java_toolchain=21
pack_format=32

# The 1.20.6 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# newer Forge APIs.
source_chain=1.20.1,1.20.2,1.20.3,1.20.5,1.20.6,shared/no-browser,shared/forge-family,shared/forge,shared/forge-1.20.6,shared/recorder,shared/recorder-to-1.21.10,shared/recorder-to-1.21.8,shared/recorder-to-1.21.5,shared/recorder-to-1.21.4,shared/recorder-to-1.21.1,shared/recorder-to-1.20.6
recorder_mixins=true
