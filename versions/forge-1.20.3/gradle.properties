# Breeze on Forge, Minecraft 1.20.3 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-15 (the build the launcher installs).
platform=forge
minecraft_version=1.20.3
forge_toolchain=forgegradle6
loader_build=1.20.3-49.0.2

minecraft_range=[1.20.3,1.20.4)
loader_range=[49,)

java_release=17
mixin_java=JAVA_17
pack_format=22

# The 1.20.3 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# newer Forge APIs.
source_chain=1.20.1,1.20.2,1.20.3,shared/no-browser,shared/forge-family,shared/forge
