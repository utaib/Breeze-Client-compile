# Everything that is true of this Minecraft version and no other
# (gradle/version.gradle reads these).
minecraft_version=1.20.1
loader_version=0.16.14
fabric_api_version=0.92.2+1.20.1

# What the jar declares in fabric.mod.json: this version only, since 1.20 has
# its own jar.
minecraft_range=1.20.1
loader_min=0.15.0

# Bytecode level the Minecraft version's runtime can load, and the matching
# Mixin compatibility level.
java_release=17
mixin_java=JAVA_17

# MCEF publishes a Fabric build for this version: the web interface exists.
mcef_version=2.1.6-1.20.1

# The base: every other version's source_chain starts here.
source_chain=1.20.1
