# Breeze on Forge, Minecraft 1.19.2 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-14 (the build the launcher installs).
platform=forge
minecraft_version=1.19.2
loader_build=1.19.2-43.5.0

minecraft_range=[1.19.2,1.19.3)
loader_range=[43,)

java_release=17
mixin_java=JAVA_17
pack_format=9

# The 1.19.2 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# older or newer Forge APIs.
source_chain=1.20.1,1.19.4,1.19.3,1.19.2,shared/no-browser,shared/forge-family,shared/forge,shared/forge-1.19,shared/forge-1.19.2
