# Breeze on NeoForge, Minecraft 1.20.6 (gradle/forge.gradle reads these).
# NeoForge's newest build for this version that is not a beta, as listed on 2026-11-15 (the build the launcher installs).
platform=neoforge
minecraft_version=1.20.6
loader_build=20.6.144

minecraft_range=[1.20.6,1.20.7)
loader_range=[20.6,)

java_release=21
mixin_java=JAVA_21
pack_format=32

# The 1.20.6 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to NeoForge: shared/forge-family, shared/neoforge and the layers for
# older or newer NeoForge APIs.
source_chain=1.20.1,1.20.2,1.20.3,1.20.5,1.20.6,shared/no-browser,shared/forge-family,shared/neoforge,shared/neoforge-1.20.6,shared/recorder,shared/recorder-to-1.21.10,shared/recorder-to-1.21.8,shared/recorder-to-1.21.5,shared/recorder-to-1.21.4,shared/recorder-to-1.21.1,shared/recorder-to-1.20.6
recorder_mixins=true
