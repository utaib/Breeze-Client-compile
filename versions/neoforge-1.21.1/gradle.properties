# Breeze on NeoForge, Minecraft 1.21.1 (gradle/forge.gradle reads these).
# NeoForge's newest build for this version that is not a beta, as listed on 2026-11-14 (the build the launcher installs).
platform=neoforge
minecraft_version=1.21.1
loader_build=21.1.266

minecraft_range=[1.21.1,1.21.2)
loader_range=[21.1,)

java_release=21
mixin_java=JAVA_21
pack_format=34

# The 1.21.1 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to NeoForge: shared/forge-family, shared/neoforge and the layers for
# older or newer NeoForge APIs.
source_chain=1.20.1,1.20.2,1.20.3,1.20.5,1.21,1.21.1,shared/no-browser,shared/forge-family,shared/neoforge,shared/recorder,shared/recorder-to-1.21.10,shared/recorder-to-1.21.8,shared/recorder-to-1.21.5,shared/recorder-to-1.21.4,shared/recorder-to-1.21.1
recorder_mixins=true
