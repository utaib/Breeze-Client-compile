# Breeze on Forge, Minecraft 1.17.1 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-14 (the build the launcher installs).
platform=forge
minecraft_version=1.17.1
loader_build=1.17.1-37.1.1

minecraft_range=[1.17.1,1.18)
loader_range=[37,)

java_release=16
mixin_java=JAVA_16
pack_format=7

# The 1.17.1 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# older or newer Forge APIs.
source_chain=1.20.1,1.19.4,1.19.3,1.19.2,1.19,1.18.2,1.17.1,shared/no-browser,shared/forge-family,shared/forge,shared/forge-1.19,shared/forge-1.18,shared/forge-1.17,shared/recorder,shared/recorder-to-1.21.10,shared/recorder-to-1.21.8,shared/recorder-to-1.21.5,shared/recorder-to-1.21.4,shared/recorder-to-1.21.1,shared/recorder-to-1.20.6,shared/recorder-to-1.20.4,shared/recorder-to-1.20.2,shared/recorder-to-1.20.1,shared/recorder-to-1.19.4,shared/recorder-to-1.19.3,shared/recorder-to-1.19.2,shared/recorder-to-1.18.2,shared/recorder-to-1.18.1,shared/recorder-to-1.17.1
recorder_mixins=true
