# Breeze on Forge, Minecraft 1.20 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-14 (the build the launcher installs).
platform=forge
minecraft_version=1.20
loader_build=1.20-46.0.14

minecraft_range=[1.20,1.20.1)
loader_range=[46,)

java_release=17
mixin_java=JAVA_17
pack_format=15

# The 1.20 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# older or newer Forge APIs.
source_chain=1.20.1,shared/no-browser,shared/forge-family,shared/forge,shared/recorder,shared/recorder-to-1.21.10,shared/recorder-to-1.21.8,shared/recorder-to-1.21.5,shared/recorder-to-1.21.4,shared/recorder-to-1.21.1,shared/recorder-to-1.20.6,shared/recorder-to-1.20.4,shared/recorder-to-1.20.2,shared/recorder-to-1.20.1
recorder_mixins=true
