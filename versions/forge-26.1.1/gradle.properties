# Breeze on Forge, Minecraft 26.1.1 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-15 (the build the launcher installs).
platform=forge
minecraft_version=26.1.1
loader_build=26.1.1-63.0.2
forge_toolchain=forgegradle

minecraft_range=[26.1.1,26.1.2)
loader_range=[63,)

java_release=25
mixin_java=JAVA_25

