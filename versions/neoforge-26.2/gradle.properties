# Breeze on NeoForge, Minecraft 26.2 (gradle/forge.gradle reads these).
# NeoForge's newest build for this version that is not a beta, as listed on 2026-11-14 (the build the launcher installs).
platform=neoforge
minecraft_version=26.2
loader_build=26.2.0.93

minecraft_range=[26.2,26.2.1)
loader_range=[26.2,)

java_release=25
mixin_java=JAVA_25

# The 26.2 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to NeoForge: shared/forge-family, shared/neoforge and the layers for
# older or newer NeoForge APIs.
source_chain=1.20.1,1.20.2,1.20.3,1.20.5,1.21,1.21.2,1.21.4,1.21.5,1.21.6,1.21.9,1.21.10,1.21.11,26.1,26.2,shared/no-browser,shared/forge-family,shared/forge-family-1.21.9,shared/neoforge,shared/neoforge-1.21.9,shared/neoforge-26.2
