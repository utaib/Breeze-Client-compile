# Breeze on Forge, Minecraft 1.21 (gradle/forge.gradle reads these).
# Forge's recommended build for this version, or its latest when none is recommended, as listed on 2026-11-15 (the build the launcher installs).
platform=forge
minecraft_version=1.21
loader_build=1.21-51.0.33
forge_toolchain=forgegradle

minecraft_range=[1.21,1.21.1)
loader_range=[51,)

java_release=21
mixin_java=JAVA_21
pack_format=34

# The 1.21 Fabric source, no browser (the browsers are Fabric mods), then what
# speaks to Forge: shared/forge-family, shared/forge and the layers for
# newer Forge APIs.
source_chain=1.20.1,1.20.2,1.20.3,1.20.5,1.21,shared/no-browser,shared/forge-family,shared/forge,shared/forge-1.20.6,shared/forge-1.21
