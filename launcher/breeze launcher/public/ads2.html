<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Breeze Ad</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:rgba(10,14,26,0);display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .ad-wrap{width:100%;max-width:728px;min-height:90px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;position:relative}
  .ad-label{position:absolute;top:4px;left:6px;font-size:8px;color:rgba(255,255,255,.2);letter-spacing:.05em;text-transform:uppercase;font-weight:700}
  ins.adsbygoogle{display:block!important;width:100%;min-height:90px}
  .ad-fallback{padding:12px;font-size:11px;color:rgba(255,255,255,.18);text-align:center}
</style>
</head>
<body>
<div class="ad-wrap">
  <span class="ad-label">Ad</span>
  <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-full-width-responsive="true"></ins>
</div>
<!-- Client ID + Slot IDs live in ONE place: /ads-config.js (see ADSENSE.md) -->
<script>window.BREEZE_AD_SLOT_INDEX = 2;</script>
<script src="/ads-config.js"></script>
</body>
</html>
