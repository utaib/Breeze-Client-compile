// Breeze for Forge or NeoForge, applied by versions/forge-*/build.gradle and
// versions/neoforge-*/build.gradle after they apply their build plugin:
//
//   ModDevGradle net.neoforged.moddev.legacyforge   Forge 1.17.1 to 1.20.1,
//       which runs on SRG names: mixin refmap, jar reobfuscated
//   ForgeGradle 6 net.minecraftforge.gradle          Forge 1.20.2 to 1.20.4
//       (forge_toolchain=forgegradle6), also SRG names, with MixinGradle for
//       the refmap. ModDevGradle cannot set these up and ForgeGradle 6 needs
//       Gradle 8, so they build in a Gradle 8.12.1 run of their own
//       (the workflow's loaders job)
//   ForgeGradle 7 net.minecraftforge.gradle          Forge 1.20.6 and later
//       (forge_toolchain=forgegradle), which runs on Mojang's names, as in
//       Forge's own example projects for those versions
//   ModDevGradle net.neoforged.moddev                NeoForge (Mojang's names)
//
// The Fabric builds use gradle/version.gradle instead.
//
// The source is the same chain of folders as a Fabric build of that
// Minecraft version (gradle/sources.gradle), ending with shared/forge-family
// and the loader's own folder, which replace the few files that speak to the
// loader: the entry point (BreezeClient), compat/Hooks, compat/Keys,
// compat/Platform, integrations/Integrations and the mod metadata. Everything
// else, mixins included, is the Fabric build's code.
//
// The version folder's gradle.properties:
//
//   platform            forge or neoforge
//   minecraft_version   the Minecraft release
//   loader_build        Forge's version (1.20.1-47.4.28) or NeoForge's (21.1.266)
//   minecraft_range     the range written into mods.toml ([1.20.1,1.20.2))
//   loader_range        the loader range written into mods.toml
//   java_release        bytecode level
//   java_toolchain      the Java ForgeGradle sets Minecraft up with, when it
//                       differs from java_release (Forge 1.20.6 and 26.x,
//                       whose Mixin does not know their Java's level)
//   forge_toolchain     forgegradle (Forge 1.20.6 and later), forgegradle6
//                       (Forge 1.20.2 to 1.20.4), else ModDevGradle
//   mixin_java          Mixin compatibility level
//   source_chain        as for Fabric (gradle/version.gradle, "Sources")
//
// The jar is named <minecraft>-<loader>.jar (1.20.1-forge.jar), which is what
// the launcher asks the API for on that loader.

def mc = project.minecraft_version
def platform = project.platform
// The recorder's own mixins (versions/shared/recorder), where the chain has it.
def recorderMixins = project.findProperty('recorder_mixins') == 'true'

if (!(platform in ['forge', 'neoforge'])) {
    throw new GradleException("${project.name}: platform must be forge or neoforge, not '$platform'")
}
def forge = platform == 'forge'
// Forge 1.20.6 and later: ForgeGradle 7, Mojang's names at run time, no
// refmap and no reobfuscation.
def forgeGradle = forge && project.findProperty('forge_toolchain') == 'forgegradle'
// Forge 1.20.2 to 1.20.4: ForgeGradle 6 (Gradle 8), SRG names.
def forgeGradle6 = forge && project.findProperty('forge_toolchain') == 'forgegradle6'
// Forge on SRG names (1.17.1 to 1.20.4): the mixins need a refmap.
def srgForge = forge && !forgeGradle
def jarName = "${mc}-${platform}"

version = rootProject.mod_version
group = rootProject.maven_group

evaluationDependsOn(':common')

java {
    withSourcesJar()
}

base {
    archivesName = jarName
}

apply from: rootProject.file('gradle/sources.gradle')

repositories {
    // The Mixin annotation processor (Forge only; NeoForge needs no refmap).
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

if (forgeGradle) {
    // As Forge's example project: Mojang's official names (26.x has none to
    // map, its code is not obfuscated), Minecraft and Forge through
    // ForgeGradle's Mavenizer.
    java.toolchain.languageVersion = JavaLanguageVersion.of((project.findProperty('java_toolchain') ?: project.java_release) as Integer)
    // Compiled for an older Java than Minecraft's (java_toolchain): Gradle
    // would then look for libraries made for that older Java and refuse
    // Forge's, which say Java 21 or 25 (run 43673993732).
    if (project.findProperty('java_toolchain')) java.disableAutoTargetJvm()
    minecraft {
        if (!mc.startsWith('26.')) {
            mappings channel: 'official', version: mc
        }
        runs {
            register('client')
        }
    }
    repositories {
        minecraft.mavenizer(it)
        maven fg.forgeMaven
        maven fg.minecraftLibsMaven
    }
    dependencies {
        implementation minecraft.dependency("net.minecraftforge:forge:${project.loader_build}")
    }
} else if (forgeGradle6) {
    // As Forge's example project for these versions, plus MixinGradle, which
    // writes the refmap and hands it to reobfJar.
    java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_release as Integer)
    minecraft {
        mappings channel: 'official', version: mc
        runs {
            client {
                workingDirectory project.file('run')
            }
        }
    }
    dependencies {
        minecraft "net.minecraftforge:forge:${project.loader_build}"
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
    mixin {
        add sourceSets.main, 'breeze.refmap.json'
        config 'breeze.mixins.json'
        if (recorderMixins) config 'breeze-recorder.mixins.json'
    }
    tasks.named('jar') { finalizedBy 'reobfJar' }
} else if (forge) {
    legacyForge {
        version = project.loader_build
        runs {
            client {
                client()
            }
        }
        mods {
            breeze {
                sourceSet sourceSets.main
            }
        }
    }
    // Forge 1.20.1 runs on SRG names, so the mixins need a refmap; the jar is
    // reobfuscated by reobfJar (set up by the plugin on the jar task).
    mixin {
        add sourceSets.main, 'breeze.refmap.json'
        config 'breeze.mixins.json'
        if (recorderMixins) config 'breeze-recorder.mixins.json'
    }
    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
} else {
    neoForge {
        version = project.loader_build
        runs {
            client {
                client()
            }
        }
        mods {
            breeze {
                sourceSet sourceSets.main
            }
        }
    }
}

dependencies {
    // The portable half, merged into this jar (see jar below).
    implementation project(':common')
    // @Nullable and friends, which shared code uses; Forge 1.17's libraries
    // do not bring them (later Forge and NeoForge do).
    compileOnly 'org.jetbrains:annotations:24.1.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── The interface ──────────────────────────────────────────────────────────
// No browser on these loaders (shared/no-browser is in the chain), but the
// page is packaged as on Fabric so the jar's layout is the same.
def webDist = rootProject.file('frontend/dist')
def buildWebUi = rootProject.tasks.named('buildWebUi')

// The jar's resource pack metadata, with this Minecraft's pack format
// (pack_format in the version's gradle.properties). A version without one
// ships none, and the loader makes its own.
def packFormat = project.findProperty('pack_format')
def packMeta = null
if (packFormat) {
    def packDir = layout.buildDirectory.dir('generated/breeze-pack')
    def text = "{\n  \"pack\": {\n    \"description\": \"Breeze\",\n    \"pack_format\": ${packFormat}\n  }\n}\n"
    packMeta = tasks.register('breezePackMeta') {
        inputs.property('text', text)
        outputs.dir(packDir)
        doLast {
            def dir = packDir.get().asFile
            dir.mkdirs()
            new File(dir, 'pack.mcmeta').text = text
        }
    }
}

processResources {
    dependsOn buildWebUi
    def props = [
            'version'        : project.version,
            'minecraft_range': project.minecraft_range,
            'loader_range'   : project.loader_range,
            'java_release'   : project.java_release,
            'mixin_java'     : project.mixin_java,
            'recorder_mixins_toml': recorderMixins ? '\n[[mixins]]\nconfig="breeze-recorder.mixins.json"\n' : '',
    ]
    inputs.properties props
    inputs.property('platform', platform)
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'breeze.mixins.json', 'breeze-forge.mixins.json', 'breeze-recorder.mixins.json']) {
        expand props
    }
    if (srgForge) {
        // The refmap the annotation processor writes, named in the config so
        // Mixin finds it at runtime.
        filesMatching(['breeze.mixins.json', 'breeze-recorder.mixins.json']) {
            filter { String line ->
                line.contains('"package"') ? line + '\n  "refmap": "breeze.refmap.json",' : line
            }
        }
    }
    from(webDist) {
        into 'assets/breeze/html'
        exclude '**/*.map'
    }
    if (packMeta != null) from(packMeta)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = (project.java_release as Integer)
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.named('sourcesJar') { dependsOn buildWebUi }

jar {
    from project(':common').sourceSets.main.output
    manifest {
        attributes([
                'Implementation-Title'  : 'Breeze',
                'Implementation-Version': project.version,
                'Minecraft-Version'     : mc,
                'Minecraft-Range'       : project.minecraft_range,
                'Breeze-Loader'         : platform,
        ] + (forge ? ['MixinConfigs': (forgeGradle ? 'breeze.mixins.json,breeze-forge.mixins.json' : 'breeze.mixins.json') + (recorderMixins ? ',breeze-recorder.mixins.json' : '')] : [:]))
    }
}

// The jar players get: on SRG Forge the reobfuscated one, otherwise the plain
// one (Forge 1.20.6+ and NeoForge run on Mojang's names). Copied to
// build/release/<mc>-<loader>.jar so the workflow and the launcher find it by
// one name.
// ForgeGradle 6 makes reobfJar only once the project is evaluated, and it
// rewrites the jar in place: copy the jar after it.
def finalJar = (srgForge && !forgeGradle6) ? tasks.named('reobfJar') : tasks.named('jar')
def release = tasks.register('releaseJar', Copy) {
    description = "Copies the jar players get to build/release/${jarName}.jar."
    if (forgeGradle6) dependsOn 'reobfJar'
    from(finalJar)
    into layout.buildDirectory.dir('release')
    rename { "${jarName}.jar" }
}
// On SRG Forge a jar that was not reobfuscated loads and then fails at the
// first mixin (Forge 1.20.3, round 2 of the third 1.2.3 test: ForgeGradle 6's
// in-place reobfuscation was once missing from the copied jar). The released
// jar must have the SRG name of a field every mixin set uses.
if (srgForge) {
    release.configure {
        doLast {
            def f = new File(destinationDir, "${jarName}.jar")
            def zip = new java.util.zip.ZipFile(f)
            try {
                def e = zip.getEntry('dev/breeze/mixin/MinecraftSetScreenMixin.class')
                if (e != null) {
                    def text = new String(zip.getInputStream(e).bytes, 'ISO-8859-1')
                    if (!text.contains('f_91073_')) {
                        def bd = project.layout.buildDirectory.get().asFile
                        bd.eachFileRecurse { x -> if (x.name.endsWith('.tsrg') || x.name.endsWith('refmap.json')) println "DEBUG file ${x} ${x.length()}" }
                        def m = new File(bd, 'tmp/compileJava/compileJava-mappings.tsrg')
                        if (m.exists()) m.eachLine { l -> if (l.contains('MinecraftSetScreenMixin') || l.contains('Minecraft ') || l.contains(' level ') || l.startsWith('net/minecraft/client/Minecraft')) println "DEBUG map ${l}" }
                        def m2 = new File(bd, 'createMcpToSrg/output.tsrg')
                        boolean inMc = false
                        if (m2.exists()) m2.eachLine { l -> if (!l.startsWith('\t')) inMc = l.startsWith('net/minecraft/client/Minecraft '); else if (inMc && l.contains('level')) println "DEBUG mcp ${l}" }
                        def lj = new File(bd, 'libs'); lj.eachFile { x -> println "DEBUG libs ${x} ${x.length()} ${new Date(x.lastModified())}" }
                        tasks.findByName('reobfJar')?.with { t -> println "DEBUG reobf ${t.class} inputs=${t.inputs.files.files.take(8)} outputs=${t.outputs.files.files}"; try { println "DEBUG reobf extra ${t.extraMappings.files}" } catch (ex) { println "DEBUG reobf extra ? ${ex}" } }
                        def i = text.indexOf('level'); println "DEBUG class strings around level: " + text.substring(Math.max(0,i-80), Math.min(text.length(), i+40)).replaceAll('[^ -~]','.')
                        throw new GradleException("${jarName}.jar is not reobfuscated (MinecraftSetScreenMixin still names Minecraft.level); build it again")
                    }
                }
            } finally {
                zip.close()
            }
        }
    }
}
tasks.named('build') { dependsOn release }

test {
    useJUnitPlatform()
}
