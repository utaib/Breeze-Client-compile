// Breeze for Forge or NeoForge, applied by versions/forge-*/build.gradle and
// versions/neoforge-*/build.gradle after they apply ModDevGradle:
// net.neoforged.moddev.legacyforge for Forge (1.20.1) and net.neoforged.moddev
// for NeoForge (1.21.1). The Fabric builds use gradle/version.gradle instead.
//
// The source is the same chain of folders as a Fabric build of that
// Minecraft version (gradle/sources.gradle), ending with shared/forge-family
// and the loader's own folder, which replace the few files that speak to the
// loader: the entry point (BreezeClient), compat/Hooks, compat/Keys,
// compat/Platform, integrations/Integrations and the mod metadata. Everything
// else, mixins included, is the Fabric build's code.
//
// The version folder's gradle.properties:
//
//   platform            forge or neoforge
//   minecraft_version   the Minecraft release
//   loader_build        Forge's version (1.20.1-47.4.28) or NeoForge's (21.1.266)
//   minecraft_range     the range written into mods.toml ([1.20.1,1.20.2))
//   loader_range        the loader range written into mods.toml
//   java_release        bytecode level
//   mixin_java          Mixin compatibility level
//   source_chain        as for Fabric (gradle/version.gradle, "Sources")
//
// The jar is named <minecraft>-<loader>.jar (1.20.1-forge.jar), which is what
// the launcher asks the API for on that loader.

def mc = project.minecraft_version
def platform = project.platform
if (!(platform in ['forge', 'neoforge'])) {
    throw new GradleException("${project.name}: platform must be forge or neoforge, not '$platform'")
}
def forge = platform == 'forge'
def jarName = "${mc}-${platform}"

version = rootProject.mod_version
group = rootProject.maven_group

evaluationDependsOn(':common')

java {
    withSourcesJar()
}

base {
    archivesName = jarName
}

apply from: rootProject.file('gradle/sources.gradle')

repositories {
    // The Mixin annotation processor (Forge only; NeoForge needs no refmap).
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    mavenCentral()
}

if (forge) {
    legacyForge {
        version = project.loader_build
        runs {
            client {
                client()
            }
        }
        mods {
            breeze {
                sourceSet sourceSets.main
            }
        }
    }
    // Forge 1.20.1 runs on SRG names, so the mixins need a refmap; the jar is
    // reobfuscated by reobfJar (set up by the plugin on the jar task).
    mixin {
        add sourceSets.main, 'breeze.refmap.json'
        config 'breeze.mixins.json'
    }
    dependencies {
        annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    }
} else {
    neoForge {
        version = project.loader_build
        runs {
            client {
                client()
            }
        }
        mods {
            breeze {
                sourceSet sourceSets.main
            }
        }
    }
}

dependencies {
    // The portable half, merged into this jar (see jar below).
    implementation project(':common')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── The interface ──────────────────────────────────────────────────────────
// No browser on these loaders (shared/no-browser is in the chain), but the
// page is packaged as on Fabric so the jar's layout is the same.
def webDist = rootProject.file('frontend/dist')
def buildWebUi = rootProject.tasks.named('buildWebUi')

processResources {
    dependsOn buildWebUi
    def props = [
            'version'        : project.version,
            'minecraft_range': project.minecraft_range,
            'loader_range'   : project.loader_range,
            'java_release'   : project.java_release,
            'mixin_java'     : project.mixin_java,
    ]
    inputs.properties props
    inputs.property('platform', platform)
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'breeze.mixins.json']) {
        expand props
    }
    if (forge) {
        // The refmap the annotation processor writes, named in the config so
        // Mixin finds it at runtime.
        filesMatching('breeze.mixins.json') {
            filter { String line ->
                line.contains('"package"') ? line + '\n  "refmap": "breeze.refmap.json",' : line
            }
        }
    }
    from(webDist) {
        into 'assets/breeze/html'
        exclude '**/*.map'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = (project.java_release as Integer)
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.named('sourcesJar') { dependsOn buildWebUi }

jar {
    from project(':common').sourceSets.main.output
    manifest {
        attributes([
                'Implementation-Title'  : 'Breeze',
                'Implementation-Version': project.version,
                'Minecraft-Version'     : mc,
                'Minecraft-Range'       : project.minecraft_range,
                'Breeze-Loader'         : platform,
        ] + (forge ? ['MixinConfigs': 'breeze.mixins.json'] : [:]))
    }
}

// The jar players get: on Forge the reobfuscated one, on NeoForge the plain
// one (NeoForge runs on Mojang's names). Copied to build/release/<mc>-<loader>.jar
// so the workflow and the launcher find it by one name.
def finalJar = forge ? tasks.named('reobfJar') : tasks.named('jar')
def release = tasks.register('releaseJar', Copy) {
    description = "Copies the jar players get to build/release/${jarName}.jar."
    from(finalJar)
    into layout.buildDirectory.dir('release')
    rename { "${jarName}.jar" }
}
tasks.named('build') { dependsOn release }

test {
    useJUnitPlatform()
}
