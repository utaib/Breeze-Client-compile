// Breeze for one Minecraft version, applied by each versions/<mc>/build.gradle
// after it applies Loom: net.fabricmc.fabric-loom-remap up to 1.21.11, which
// ship obfuscated, and net.fabricmc.fabric-loom from 26.1, which do not.
// Everything else that differs per version is in its gradle.properties:
//
//   minecraft_version   the Minecraft release this jar is built against
//   loader_version      Fabric Loader used to build and run it
//   fabric_api_version  Fabric API build for this Minecraft version
//   fabric_api_id       Fabric API's mod id in that build: "fabric" up to
//                       1.19.1 (except 1.18.2's late builds), "fabric-api"
//                       after; the default is "fabric-api"
//   java_release        bytecode level Minecraft's own Java can load
//   minecraft_range     what fabric.mod.json declares (the version itself)
//   loader_min          the oldest Fabric Loader the jar accepts
//   mixin_java          Mixin compatibility level for breeze.mixins.json
//   mcef_version        MCEF build on Modrinth, only where one exists
//   mcef_project        the Modrinth project that build is in (default mcef;
//                       rinku for Keksuccino's builds of 1.21.5 and later)
//   mcef_bundled        true: the build travels inside Breeze's jar (Fabric
//                       nested jar), for versions the launcher installs no
//                       browser on
//   mcef_minecraft      only with mcef_bundled: the Minecraft range written
//                       into the bundled browser's own fabric.mod.json, for a
//                       version its author built for the next patch release
//                       only (26.1 runs Rinku's 26.1.1 build). The rest of
//                       the jar is unchanged (LGPL-2.1+ allows the edit)
//   mcef_relax          with mcef_minecraft: the browser's other dependencies
//                       (comma-separated mod ids, such as fabric-api, or *
//                       for all but minecraft, java and fabricloader) that
//                       become "*", when its author asked for a newer build
//                       than this Minecraft version has
//   obfuscated          false from 26.1: no mappings and no remapping
//   source_chain        folders under versions/ whose src/main make up this
//                       version's source, oldest first (see "Sources")

def mc = project.minecraft_version
def obfuscated = (project.findProperty('obfuscated') ?: 'true').toString().toBoolean()
def loomPlugin = obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
if (!plugins.hasPlugin(loomPlugin)) {
    throw new GradleException("${project.name}/build.gradle must apply $loomPlugin (obfuscated=$obfuscated)")
}

version = rootProject.mod_version
group = rootProject.maven_group

// The jar takes common's classes (see jar below), so common is configured
// first even when a build asks for this project alone.
evaluationDependsOn(':common')

// The sources jar exists before anything below names it.
java {
    withSourcesJar()
}

base {
    archivesName = mc
}

// The spec's naming: the jar players get is called after the Minecraft version
// only, 1.20.1.jar; the mod version lives inside it (fabric.mod.json and the
// manifest). Loom would otherwise append the version. Where Loom remaps, the
// unmapped dev jar gets a classifier so it can never be mistaken for the real
// one; from 26.1 there is no remapping and the plain jar is the real one.
if (obfuscated) {
    tasks.named('jar') { archiveClassifier = 'dev' }
    tasks.named('remapJar') { archiveFileName = "${mc}.jar" }
    tasks.named('remapSourcesJar') { archiveFileName = "${mc}-sources.jar" }
} else {
    tasks.named('jar') { archiveFileName = "${mc}.jar" }
    tasks.named('sourcesJar') { archiveFileName = "${mc}-sources.jar" }
}

// ── Sources ────────────────────────────────────────────────────────────────
//
// Most code is the same across Minecraft versions, and the part that is not
// changes at a few points (1.20.2, 1.20.5, 1.21.2, 1.21.6, ...). So a version's
// source is a chain of folders, oldest first: versions/1.20.1/src/main is the
// full base, and each later folder holds only the files that differ from what
// comes before it. The newest folder that has a file wins. A folder's
// removed.txt lists paths (relative to src/main) that older folders have and
// this version must not. versions/shared/no-browser is the chain's last link on
// versions MCEF does not cover.
//
// A folder's renames.txt handles what Minecraft only renamed or moved: each
// line is "old new", a class name or a qualified name, and every Java file of
// the merged source has old replaced by new wherever it stands as a whole name
// (so a simple name also renames it in imports). A name starting with a dot
// (".drawString .text") renames a method or field where it is called on
// something. Renames apply in chain order.
//
// A version whose chain is just itself compiles its own folder directly. Any
// other is merged into build/merged-src first; edit the files in versions/,
// never the merged copy. The source ZIP (scripts/package-source.sh) ships the
// merged result, so a ZIP is always one plain folder.
apply from: rootProject.file('gradle/sources.gradle')

// A browser build for the next patch release of Minecraft, with only the
// Minecraft range in its fabric.mod.json changed (mcef_minecraft, mcef_relax).
// Fabric checks a nested mod's dependencies like any other, so the build its
// author made for 26.1.1 would stop 26.1 from starting. Written once into a
// folder repository under build/, then used by its own coordinates for
// compiling, the development client and the nested jar alike.
def patchedRepo = layout.buildDirectory.dir('patched-browser').get().asFile
ext.patchedBrowser = { String coords ->
    def (group, name, version) = coords.split(':')
    def patchedVersion = "${version}-mc${mc}"
    def dir = new File(patchedRepo, "breeze/patched/${name}/${patchedVersion}")
    def jar = new File(dir, "${name}-${patchedVersion}.jar")
    if (!jar.isFile()) {
        // Fetched straight from Modrinth's Maven, not through this project's
        // repositories: resolving them while the build script runs makes Loom
        // fail its Minecraft setup ("Cannot mutate content repository
        // descriptor after repository has been used", 1.20 in run 42515365247).
        dir.mkdirs()
        def source = new File(dir, "${name}-${version}-original.jar")
        if (!source.isFile()) {
            def url = new URL("https://api.modrinth.com/maven/maven/modrinth/${name}/${version}/${name}-${version}.jar")
            def part = new File(dir, source.name + '.part')
            url.withInputStream { i -> part.withOutputStream { o -> o << i } }
            part.renameTo(source)
        }
        def relaxValue = (project.findProperty('mcef_relax') ?: '').toString().trim()
        def relax = relaxValue.split(',')*.trim().findAll { it }
        def tmp = new File(dir, jar.name + '.tmp')
        new java.util.zip.ZipFile(source).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmp)).withCloseable { out ->
                zip.entries().each { e ->
                    out.putNextEntry(new java.util.zip.ZipEntry(e.name))
                    if (e.name == 'fabric.mod.json') {
                        def meta = new groovy.json.JsonSlurper().parse(zip.getInputStream(e))
                        meta.depends = meta.depends ?: [:]
                        logger.lifecycle("[breeze] ${coords} depends on ${meta.depends}")
                        meta.depends.minecraft = project.mcef_minecraft
                        if (relaxValue == '*') {
                            // Everything but Minecraft, Java and the loader.
                            meta.depends.keySet().findAll { !(it in ['minecraft', 'java', 'fabricloader']) }.each { meta.depends[it] = '*' }
                        } else {
                            relax.each { id -> if (meta.depends.containsKey(id)) meta.depends[id] = '*' }
                        }
                        out.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta)).getBytes('UTF-8'))
                    } else if (!e.isDirectory()) {
                        zip.getInputStream(e).withCloseable { out << it }
                    }
                    out.closeEntry()
                }
            }
        }
        tmp.renameTo(jar)
        new File(dir, "${name}-${patchedVersion}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
<groupId>breeze.patched</groupId><artifactId>${name}</artifactId><version>${patchedVersion}</version></project>
"""
        logger.lifecycle("[breeze] ${coords}: Minecraft range set to ${project.mcef_minecraft}" + (relax ? ", ${relax.join(', ')} relaxed" : ''))
    }
    return "breeze.patched:${name}:${patchedVersion}"
}

repositories {
    maven {
        name = 'PatchedBrowser'
        url = patchedRepo
        content { includeGroup 'breeze.patched' }
    }
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    // MCEF, the embedded browser, as published on Modrinth.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
    }
    def mod = obfuscated ? 'modImplementation' : 'implementation'
    add(mod, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(mod, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")

    // The portable half. Plain Java, so its classes are merged into this jar
    // (see jar below) rather than nested: Fabric only loads nested jars that
    // are themselves mods.
    implementation project(':common')

    // MCEF, compile only. The mod runs without it (native menus); with it, the
    // web interface. Not declared in fabric.mod.json, so an install without
    // MCEF still starts. Present in the development client so runClient shows
    // the real web interface; never part of the published jar. MCEF is
    // LGPL-2.1, by CinemaMod Group.
    def mcef = project.findProperty('mcef_version')
    if (mcef) {
        def coords = "maven.modrinth:${project.findProperty('mcef_project') ?: 'mcef'}:${mcef}"
        if (project.findProperty('mcef_minecraft')) coords = patchedBrowser(coords)
        add(obfuscated ? 'modCompileOnly' : 'compileOnly', coords)
        add(obfuscated ? 'modLocalRuntime' : 'localRuntime', coords)
        // Launcher 1.0.27 installs MCEF on the ten versions MCEF itself
        // covers. On the newer ones (Keksuccino's builds, LGPL-2.1+, unchanged)
        // the browser comes inside Breeze's jar, so no launcher update is
        // needed. Fabric loads a nested mod like any other.
        if (project.findProperty('mcef_bundled') == 'true') add('include', coords)
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── The interface ──────────────────────────────────────────────────────────
//
// The React frontend is built once, by the root project's buildWebUi, into
// frontend/dist, and packaged from there by every version. Nothing generated
// is written into src/, so the source tree cannot hold a stale bundle.
def webDist = rootProject.file('frontend/dist')
def buildWebUi = rootProject.tasks.named('buildWebUi')

processResources {
    dependsOn buildWebUi
    def props = [
            'version'        : project.version,
            'minecraft_range': project.minecraft_range,
            'loader_min'     : project.loader_min,
            'java_release'   : project.java_release,
            'mixin_java'     : project.mixin_java,
            'fabric_api_id'  : project.findProperty('fabric_api_id') ?: 'fabric-api',
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'breeze.mixins.json']) {
        expand props
    }
    from(webDist) {
        into 'assets/breeze/html'
        exclude '**/*.map'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = (project.java_release as Integer)
    it.options.encoding = 'UTF-8'
    // Every error at once when a new Minecraft version breaks many files,
    // rather than javac's first hundred.
    it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.named('sourcesJar') { dependsOn buildWebUi }

jar {
    from project(':common').sourceSets.main.output
    manifest {
        attributes([
                'Implementation-Title'  : 'Breeze',
                'Implementation-Version': project.version,
                'Minecraft-Version'     : mc,
                'Minecraft-Range'       : project.minecraft_range,
        ])
    }
}

test {
    useJUnitPlatform()
}

// runClient for automated checks: a fixed window, a dev player name, and the
// Breeze self-test switched on only when -Pbreeze.autotest is given.
loom {
    runs {
        client {
            programArgs '--width', '1280', '--height', '720', '--username', 'BreezeDev'
            if (project.hasProperty('breeze.autotest')) {
                vmArg "-Dbreeze.autotest=${project.property('breeze.autotest')}"
            }
        }
    }
}

// ── Porting aid ────────────────────────────────────────────────────────────
//
// Prints the public signatures of Minecraft (or any compile classpath) classes
// for this version, so a port can be checked against the real API instead of
// memory:
//   ./gradlew -Pbreeze_versions=1.21.2 :versions:1.21.2:printApi \
//       -Pclasses=net.minecraft.client.gui.GuiGraphics,net.minecraft.client.renderer.entity.layers.CapeLayer
tasks.register('printApi') {
    description = 'Prints javap -public for the classes in -Pclasses (comma-separated).'
    def classpath = configurations.compileClasspath
    def names = (project.findProperty('classes') ?: '').toString()
    def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
    doLast {
        def list = names.split(',').collect { it.trim() }.findAll { it }
        if (list.isEmpty()) throw new GradleException('name classes with -Pclasses=a.B,c.D')
        def cmd = [javap, '-public', '-cp', classpath.asPath] + list
        def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
        proc.inputStream.eachLine { println it }
        proc.waitFor()
    }
}

// The same for every class in scripts/ci/api-classes.txt (what Breeze uses,
// and where it moved to in later versions), into build/api.txt. A line "p X"
// includes X's private members; "c X" also lists, per method of X, the calls
// it makes (for a mixin that hooks a call inside a method). A class this
// version lacks is listed with the classes of the same simple name it has, and
// the file ends with every class in the packages Breeze draws and hooks with,
// which is where renames show.
tasks.register('dumpApi') {
    description = 'Writes build/api.txt: the signatures Breeze uses on this version.'
    def classpath = configurations.compileClasspath
    def listFile = rootProject.file('scripts/ci/api-classes.txt')
    def out = layout.buildDirectory.file('api.txt').get().asFile
    def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
    doLast {
        def all = new TreeSet<String>()
        classpath.files.findAll { it.name.endsWith('.jar') }.each { f ->
            new java.util.zip.ZipFile(f).withCloseable { z ->
                z.entries().each { e ->
                    if (e.name.endsWith('.class') && !e.name.startsWith('META-INF')) {
                        all << e.name[0..-7].replace('/', '.')
                    }
                }
            }
        }
        def simple = { String n -> n.substring(n.lastIndexOf('.') + 1) }
        def bySimple = all.groupBy { simple(it) }
        def entries = listFile.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
        out.parentFile.mkdirs()
        out.withWriter('UTF-8') { w ->
            w << "== api of minecraft ${mc}\n"
            def present = [], privateToo = [], calls = [], code = []
            entries.each { line ->
                def priv = line.startsWith('p ') || line.startsWith('c ') || line.startsWith('j ')
                def name = priv ? line.substring(2).trim() : line
                if (all.contains(name)) {
                    (priv ? privateToo : present) << name
                    if (line.startsWith('c ')) calls << name
                    if (line.startsWith('j ')) code << name
                } else {
                    def alike = bySimple[simple(name)] ?: []
                    w << "MISSING ${name}" << (alike ? " -> ${alike.join(', ')}" : '') << '\n'
                }
            }
            [[present, '-public'], [privateToo, '-private']].each { names, level ->
                names.collate(40).each { batch ->
                    def proc = new ProcessBuilder([javap, level, '-cp', classpath.asPath] + batch)
                            .redirectErrorStream(true).start()
                    proc.inputStream.eachLine('UTF-8') { w << it << '\n' }
                    proc.waitFor()
                }
            }
            calls.each { name ->
                w << "== calls ${name}\n"
                def proc = new ProcessBuilder([javap, '-c', '-p', '-cp', classpath.asPath, name])
                        .redirectErrorStream(true).start()
                proc.inputStream.eachLine('UTF-8') { l ->
                    if (l ==~ /^  \S.*\(.*/) w << l << '\n'
                    else if (l =~ /invoke(virtual|static|special|interface|dynamic)/) {
                        w << '    ' << l.replaceFirst(/^\s*\d+:\s*/, '') << '\n'
                    }
                }
                proc.waitFor()
            }
            code.each { name ->
                w << "== code ${name}\n"
                def proc = new ProcessBuilder([javap, '-c', '-p', '-constants', '-cp', classpath.asPath, name])
                        .redirectErrorStream(true).start()
                proc.inputStream.eachLine('UTF-8') { w << it << '\n' }
                proc.waitFor()
            }
            w << "== classes\n"
            def packages = ['net.minecraft.client.', 'net.minecraft.resources.', 'net.minecraft.core.', 'com.mojang.blaze3d.',
                            'net.fabricmc.fabric.api.client.', 'org.lwjgl.glfw.', 'net.minecraft.world.clock.',
                            'com.mojang.renderpearl.']
            all.findAll { n -> !n.contains('$') && packages.any { n.startsWith(it) } && !n.contains('.impl.') }
                    .each { w << it << '\n' }
        }
        println "wrote ${out} (${out.length()} bytes)"
    }
}
