name: API dump

# For porting: the signatures of every Minecraft class Breeze uses, per
# version (gradle/version.gradle, dumpApi; scripts/ci/api-classes.txt), printed
# in each job's log, gzipped and base64-encoded between BEGIN and END lines so
# a log reader limited to a few thousand lines gets all of it. Nothing is built
# or published.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated Minecraft versions (empty for all)
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: echo "matrix=$(scripts/ci/versions-matrix.sh "${{ inputs.versions }}")" >> "$GITHUB_OUTPUT"

  dump:
    name: API of ${{ matrix.v.mc }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -q -Pbreeze_versions="${{ matrix.v.mc }}" ":versions:${{ matrix.v.mc }}:dumpApi"
      - run: |
          f="versions/${{ matrix.v.mc }}/build/api.txt"
          wc -c "$f"
          echo "BEGIN api ${{ matrix.v.mc }}"
          gzip -9c "$f" | base64 -w 4000
          echo "END api ${{ matrix.v.mc }}"
