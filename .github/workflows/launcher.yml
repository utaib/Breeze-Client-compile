name: Launcher build and launch test

# Breeze Launcher installers for Windows, macOS and Linux, built here because
# the private repository's Actions are blocked by a billing problem. Only this
# branch (launcher-build) runs it; it shares no history with main.
#
# The launcher source is never this branch's tip. It is pushed in the commit
# before the one that runs (HEAD~1), together with this one, and every job
# restores launcher/ from there. When the build is done the branch is emptied
# to a README.
#
# Nothing built from the source is kept anywhere public: no caches, no
# artifacts. The installers go to a draft release, which only the owner sees.
# The launch screenshots (the sign-in screen) go to ci/launcher-smoke-* branches.
on:
  push:
    branches: [launcher-build]

permissions:
  contents: write

concurrency:
  group: launcher-build
  cancel-in-progress: false

env:
  SRC: launcher/breeze launcher

jobs:
  version:
    name: Version and draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore the launcher source from the commit before this one
        run: git checkout -q HEAD~1 -- launcher
      - id: read
        run: |
          version=$(node -p "require('./$SRC/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=launcher-$version-run$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::Breeze Client $version, launcher source $(head -1 launcher/SOURCE.txt)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.read.outputs.tag }}" --draft --target "$GITHUB_SHA" \
            --title "Breeze Client ${{ steps.read.outputs.version }} (run $GITHUB_RUN_ID)" \
            --notes "Built by run $GITHUB_RUN_ID from the private repository's launcher source ($(head -1 launcher/SOURCE.txt)). Unsigned: SmartScreen warns and Gatekeeper refuses until signed. Download the files for the API's versions/launcher/<os>/ folders; do not publish this draft."

  build:
    name: ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows installer
            bundles: nsis
            target: ''
            bundle_dir: launcher/breeze launcher/src-tauri/target/release/bundle
            patterns: '*-setup.exe'
          - os: macos-latest
            label: macOS universal disk image
            bundles: dmg
            target: universal-apple-darwin
            bundle_dir: launcher/breeze launcher/src-tauri/target/universal-apple-darwin/release/bundle
            patterns: '*.dmg'
          - os: ubuntu-22.04
            label: Linux AppImage, deb and rpm
            bundles: appimage,deb,rpm
            target: ''
            bundle_dir: launcher/breeze launcher/src-tauri/target/release/bundle
            patterns: '*.AppImage *.deb *.rpm'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore the launcher source from the commit before this one
        shell: bash
        run: git checkout -q HEAD~1 -- launcher

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Ubuntu 22.04: binaries built against an older glibc run on newer systems.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev rpm

      - name: Install and build the front end
        shell: bash
        working-directory: launcher/breeze launcher
        run: |
          npm ci
          npm run build

      - name: Build the installer
        shell: bash
        working-directory: launcher/breeze launcher
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: Rename to the release convention and hash
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p "$GITHUB_WORKSPACE/release"
          found=0
          for pattern in ${{ matrix.patterns }}; do
            while IFS= read -r -d '' file; do
              ext="${file##*.}"
              base="$(basename "$file")"
              arch=""
              case "$base" in
                *x86_64*|*amd64*|*x64*) arch="-x86_64" ;;
                *aarch64*|*arm64*)      arch="-aarch64" ;;
                *universal*)            arch="-universal" ;;
              esac
              target="$GITHUB_WORKSPACE/release/Breeze-Client-${VERSION}${arch}.${ext}"
              [ ! -e "$target" ] || { echo "::error::$(basename "$target") was produced twice"; exit 1; }
              cp "$file" "$target"
              found=$((found + 1))
            done < <(find "${{ matrix.bundle_dir }}" -type f -name "$pattern" -print0)
          done
          [ "$found" -gt 0 ] || { echo "::error::No installer was produced for ${{ matrix.label }}"; exit 1; }
          cd "$GITHUB_WORKSPACE/release"
          for file in *; do
            size=$(wc -c < "$file")
            [ "$size" -ge 524288 ] || { echo "::error::$file is only $size bytes, that is not an installer"; exit 1; }
            if command -v sha256sum > /dev/null; then sum=$(sha256sum "$file" | cut -d' ' -f1); else sum=$(shasum -a 256 "$file" | cut -d' ' -f1); fi
            echo "$sum  $file" >> "SHA256SUMS-${{ matrix.os }}.txt"
            echo "::notice title=${file}::${size} bytes, SHA-256 ${sum}"
          done

      # Install what was just built the way a player would and start it; it
      # passes when its UI calls a native command (scripts/smoke-launch.sh).
      - name: Install and start it (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls release/*.exe)
          powershell -NoProfile -Command "Start-Process -FilePath '$(cygpath -w "$PWD/$setup")' -ArgumentList '/S' -Wait"
          local_app=$(cygpath -u "$LOCALAPPDATA")
          exe=$(find "$local_app" -maxdepth 2 -path '*Breeze*' -iname '*.exe' ! -iname 'uninstall*' | head -1)
          [ -n "$exe" ] || { echo "::error::The installer put no launcher under $LOCALAPPDATA"; exit 1; }
          echo "::notice title=Windows install::$exe"
          bash "$SRC/scripts/smoke-launch.sh" "$exe" "$RUNNER_TEMP/smoke/windows-installer" | tee "$RUNNER_TEMP/smoke-result.txt"
          echo "::notice title=Windows launch::$(grep -m1 'called get_launcher_settings' "$RUNNER_TEMP/smoke-result.txt")"

      - name: Install and start it (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          app=$(find "$RUNNER_TEMP/dmg" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::The disk image holds no .app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          app="$RUNNER_TEMP/Applications/$(basename "$app")"
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          echo "::notice title=macOS architectures::$(lipo -archs "$app/Contents/MacOS/$exe")"
          codesign --verify --deep --strict --verbose=2 "$app" \
            || echo "::warning::codesign does not verify $(basename "$app")"
          bash "$SRC/scripts/smoke-launch.sh" "$app/Contents/MacOS/$exe" "$RUNNER_TEMP/smoke/macos-dmg" | tee "$RUNNER_TEMP/smoke-result.txt"
          echo "::notice title=macOS launch::$(grep -m1 'called get_launcher_settings' "$RUNNER_TEMP/smoke-result.txt")"

      - name: Install and start it (Linux AppImage and deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb imagemagick dbus-x11
          smoke="$GITHUB_WORKSPACE/$SRC/scripts/smoke-launch.sh"
          Xvfb :99 -screen 0 1440x900x24 &
          export DISPLAY=:99
          sleep 2
          appimage="$PWD/$(ls release/*.AppImage)"
          chmod +x "$appimage"
          (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract > /dev/null)
          dbus-run-session -- bash "$smoke" "$RUNNER_TEMP/squashfs-root/AppRun" "$RUNNER_TEMP/smoke/linux-appimage" | tee "$RUNNER_TEMP/smoke-appimage.txt"
          echo "::notice title=AppImage launch::$(grep -m1 'called get_launcher_settings' "$RUNNER_TEMP/smoke-appimage.txt")"
          deb="$PWD/$(ls release/*.deb)"
          sudo apt-get install -y "$deb"
          pkg=$(dpkg-deb -f "$deb" Package)
          bin=$(dpkg -L "$pkg" | grep -E '^/usr/bin/.' | head -1)
          [ -n "$bin" ] || { echo "::error::The deb installs nothing in /usr/bin"; exit 1; }
          dbus-run-session -- bash "$smoke" "$bin" "$RUNNER_TEMP/smoke/linux-deb" | tee "$RUNNER_TEMP/smoke-deb.txt"
          echo "::notice title=deb launch::$bin (package $pkg): $(grep -m1 'called get_launcher_settings' "$RUNNER_TEMP/smoke-deb.txt")"
          rpm -qip release/*.rpm
          rpm -qlp release/*.rpm | grep -E '^/usr/bin/.' \
            || { echo "::error::The rpm installs nothing in /usr/bin"; exit 1; }

      - name: Installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.version.outputs.tag }}" release/* --clobber -R "$GITHUB_REPOSITORY"

      # Screenshots only (the launcher's own log stays here, in the job log).
      - name: Launch screenshots to a branch
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          shots=$(find "$RUNNER_TEMP/smoke" -name 'screen.png' 2>/dev/null || true)
          [ -n "$shots" ] || { echo "no screenshots"; exit 0; }
          branch="ci/launcher-smoke-${GITHUB_RUN_ID}-${{ runner.os }}"
          mkdir -p "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q
          git config user.name utaib
          git config user.email utaib092008@gmail.com
          git remote add origin "https://x-access-token:$TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -q --orphan "$branch"
          (cd "$RUNNER_TEMP/smoke" && find . -name 'screen.png') | while read -r f; do
            mkdir -p "$(dirname "$f")"; cp "$RUNNER_TEMP/smoke/$f" "$f"
          done
          git add -A
          git commit -q -m "Launcher launch screenshots, run ${GITHUB_RUN_ID}, ${{ runner.os }}"
          git push -q origin "HEAD:refs/heads/$branch"

  metadata:
    name: Release metadata
    needs: [version, build]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS and release-metadata.json from the uploaded files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir files && cd files
          gh release download "${{ needs.version.outputs.tag }}" -R "$GITHUB_REPOSITORY" --pattern 'Breeze-Client-*'
          sha256sum Breeze-Client-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const map = { exe: "windows", dmg: "macos", AppImage: "linux", deb: "linux", rpm: "linux" };
            const platforms = {};
            for (const f of fs.readdirSync(".")) {
              const ext = f.split(".").pop(), p = map[ext];
              if (!p || !f.startsWith("Breeze-Client-")) continue;
              const buf = fs.readFileSync(f);
              (platforms[p] = platforms[p] || {})[ext] = { fileName: f, size: buf.length, sha256: crypto.createHash("sha256").update(buf).digest("hex") };
            }
            fs.writeFileSync("release-metadata.json", JSON.stringify({ version: process.env.VERSION, platforms }, null, 2));
            console.log(JSON.stringify({ version: process.env.VERSION, platforms }, null, 2));
          '
          gh release upload "${{ needs.version.outputs.tag }}" SHA256SUMS.txt release-metadata.json --clobber -R "$GITHUB_REPOSITORY"
          while read -r sum file; do echo "::notice title=${file}::SHA-256 ${sum}"; done < SHA256SUMS.txt
