name: Launcher

# Copied from the private repository for one run on the public build
# repository (its own Actions are blocked); removed again afterwards.
on:
  push:
    branches: [checks]
  workflow_dispatch:

jobs:
  frontend:
    name: Front end (checks, type check, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'breeze launcher'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'breeze launcher/package-lock.json'

      - run: npm ci

      # Runs the version-sync, CSS variable and motion checks, regenerates the
      # splash scenes and installer art, type-checks, then bundles. This is the
      # exact command a release build runs first, so a break here is a break
      # everywhere.
      - name: npm run build
        run: npm run build

      # The browser preview (preview.html) with every network answer stubbed:
      # the Mods page on a sample mods folder (duplicates, versions, backups,
      # accessibility). See tests/ui and playwright.config.ts.
      - name: Interface tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the interface test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interface-test-report
          path: |
            breeze launcher/playwright-report
            breeze launcher/test-results
          retention-days: 14

      # The generators rewrite tracked files. If the committed output no longer
      # matches what the sources produce, say so rather than shipping a stale
      # splash screen.
      - name: Generated output is up to date
        run: |
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet --ignore-all-space -- "breeze launcher/public/splash" "breeze launcher/src-tauri/installer"; then
            echo "::warning::Generated splash or installer art differs from the committed copy"
            git diff --stat --ignore-all-space -- "breeze launcher/public/splash" "breeze launcher/src-tauri/installer"
          fi

  # One job per OS, because a launcher that compiles on Linux says nothing about
  # macOS or Windows. Each job runs the unit tests, installs a real Java runtime
  # from Mojang, builds the app, starts it, and waits for its UI to call a
  # native command. Private-repo minutes cost more on Windows (2x) and macOS
  # (10x); these run only when launcher files change.
  native:
    name: Native shell (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            binary: breeze-launcher
          - os: windows-latest
            label: Windows
            binary: breeze-launcher.exe
          - os: macos-latest
            label: macOS
            binary: breeze-launcher
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 needs webkit2gtk 4.1. The 4.0 package from Tauri 1 produces
      # confusing link errors, so the version is pinned deliberately. Xvfb and
      # ImageMagick are for starting the app without a display and capturing it.
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libxdo-dev \
            xvfb imagemagick dbus-x11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'breeze launcher/package-lock.json'

      # tauri-build wants the front-end output to exist before it compiles, and
      # running the build scripts here also checks they work on this OS.
      - name: Build the front end
        working-directory: 'breeze launcher'
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'breeze launcher/src-tauri -> target'
          key: ${{ matrix.os }}

      - name: cargo test
        working-directory: 'breeze launcher/src-tauri'
        run: cargo test --locked

      # Downloads Mojang's Java 21 runtime for this OS into a temp folder and
      # starts it. This is the path every first launch on this OS takes.
      - name: Install and start a real Java runtime
        working-directory: 'breeze launcher/src-tauri'
        run: cargo test --locked --lib java_runtime::tests::live_install_of_java_21_starts -- --ignored --nocapture

      - name: Build the launcher
        working-directory: 'breeze launcher'
        run: npx tauri build --debug --no-bundle

      - name: Start the launcher and wait for its UI
        if: runner.os != 'Linux'
        working-directory: 'breeze launcher'
        shell: bash
        run: bash scripts/smoke-launch.sh "src-tauri/target/debug/${{ matrix.binary }}" "$RUNNER_TEMP/smoke"

      - name: Start the launcher under Xvfb and wait for its UI
        if: runner.os == 'Linux'
        working-directory: 'breeze launcher'
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          export DISPLAY=:99
          dbus-run-session -- bash scripts/smoke-launch.sh "src-tauri/target/debug/${{ matrix.binary }}" "$RUNNER_TEMP/smoke"

      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-smoke-${{ matrix.label }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
