name: Breeze mod build and test

# Temporary public build mirror of the Breeze Minecraft mod. The private
# repository (utaib/Breeze-Client, Breeze-Mod-New/) is the source of truth; this
# workflow mirrors its CI (.github/workflows/breeze-mod-new.yml there) with the
# mod at the repository root.
#
# Minecraft versions: 1.20.1 is the only version module in the source today
# (settings.gradle includes versions:1.20.1 and nothing else).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: breeze-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Interface (types, unit, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/check-version.sh
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Browsers (Playwright Chromium, and Chrome 116 as embedded by MCEF)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          curl -sSfL -o "$RUNNER_TEMP/c116.zip" https://storage.googleapis.com/chrome-for-testing-public/116.0.5845.96/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/c116.zip" -d "$RUNNER_TEMP/c116"
          echo "CHROME116=$RUNNER_TEMP/c116/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npx playwright test --reporter=line
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # Builds from the release source ZIP rather than the checkout, so one build
  # proves both the code and the ZIP. Extracted under a path with spaces.
  build:
    name: Build from the 1.20.1 source ZIP (Gradle, JUnit, jar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Package and extract the source ZIP
        run: |
          scripts/package-source.sh 1.20.1
          mkdir -p "$RUNNER_TEMP/zip build" "$RUNNER_TEMP/out"
          cp "build/release/Breeze Mod for 1.20.1.zip" "$RUNNER_TEMP/out/"
          unzip -q "build/release/Breeze Mod for 1.20.1.zip" -d "$RUNNER_TEMP/zip build"
          echo "SRC=$RUNNER_TEMP/zip build/Breeze Mod for 1.20.1" >> "$GITHUB_ENV"
      - name: Build and test the extracted source
        run: |
          cd "$SRC/frontend" && npm ci
          cd "$SRC" && ./gradlew --no-daemon :common:test :versions:1.20.1:build --stacktrace
      - name: Inspect the jar
        run: |
          jar="$SRC/versions/1.20.1/build/libs/1.20.1.jar"
          ls -la "$SRC/versions/1.20.1/build/libs/"
          unzip -l "$jar" | grep -E 'fabric.mod.json|assets/breeze/html/index.html|dev/breeze/bridge/Router.class|dev/breeze/web/BreezeWebScreen.class|dev/breeze/mixin/LightTextureMixin.class|dev/breeze/hud/ArmorHudLayout.class'
          unzip -p "$jar" fabric.mod.json
          unzip -p "$jar" breeze.mixins.json
          cp "$jar" "$RUNNER_TEMP/out/"
          cp -r "$SRC/common/build/reports" "$RUNNER_TEMP/out/common-reports" 2>/dev/null || true
          cp -r "$SRC/common/build/test-results" "$RUNNER_TEMP/out/common-test-results" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jar-source-zip-and-reports
          path: ${{ runner.temp }}/out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-jar-1.20.1
          path: ${{ runner.temp }}/out/1.20.1.jar
          retention-days: 30

  minecraft:
    name: Real Minecraft 1.20.1 (software rendered, X11 input)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Display, input and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool imagemagick ffmpeg mesa-utils x11-utils libnss3 libgbm1 libxkbcommon0
      # MCEF puts its Chromium build in ../build/mcef-libraries when the game's
      # working directory has a sibling build/ folder, as runClient's run/ does.
      - name: MCEF natives cache
        uses: actions/cache@v4
        with:
          path: versions/1.20.1/build/mcef-libraries
          key: mcef-2.1.6-1.20.1-${{ runner.os }}
      - run: npm ci
        working-directory: frontend
      - name: Launch, drive and check
        run: scripts/ci/run-minecraft-test.sh "$GITHUB_WORKSPACE/autotest"
      - name: Summary
        if: always()
        run: |
          {
            echo '## In-game run'
            echo '```'
            cat autotest/driver.log 2>/dev/null || echo 'no driver log'
            echo '```'
            echo '### Harness'
            echo '```'
            grep -E '"event":"(FAIL|READY_FOR_INPUT|stress-result|AUTOTEST_DONE|menu-open)"' autotest/breeze-autotest.log 2>/dev/null || echo 'no harness log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-evidence
          path: ${{ github.workspace }}/autotest/
          retention-days: 7

  # The jar players get, in a real Fabric install: vanilla Minecraft, Fabric
  # Loader and mods/ as a launcher sets them up (portablemc), so the game runs
  # with intermediary names exactly as for a player. Same driver and checks as
  # the development run above.
  release:
    name: Released 1.20.1 jar in a real Fabric install
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MC: '1.20.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-jar-1.20.1
          path: dist
      - name: Display, input and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool imagemagick ffmpeg mesa-utils x11-utils libnss3 libgbm1 libxkbcommon0
          pipx install "portablemc<5"
          portablemc --help | head -5
      - name: Minecraft and MCEF downloads cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.minecraft
            ~/.cache/mcef-libraries
          key: release-${{ env.MC }}-mcef-2.1.6-${{ runner.os }}
      - name: Other mods (Fabric API from Fabric's Maven, MCEF from libs)
        run: |
          props="versions/$MC/gradle.properties"
          fapi=$(sed -n 's/^fabric_api_version=//p' "$props")
          loader=$(sed -n 's/^loader_version=//p' "$props")
          echo "LOADER=$loader" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mods"
          enc=${fapi//+/%2B}
          curl -sSfL -o "$RUNNER_TEMP/mods/fabric-api-$fapi.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$enc/fabric-api-$enc.jar"
          cp versions/$MC/libs/mcef-fabric-*.jar "$RUNNER_TEMP/mods/"
          ls -la "$RUNNER_TEMP/mods" dist
      - name: Launch, drive and check
        run: |
          mkdir -p ~/.cache/mcef-libraries
          BREEZE_LAUNCH=prod BREEZE_MC="$MC" BREEZE_LOADER="$LOADER" \
          BREEZE_JAR="dist/$MC.jar" BREEZE_MODS="$RUNNER_TEMP/mods" \
          MCEF_LIBRARIES="$HOME/.cache/mcef-libraries" \
            scripts/ci/run-minecraft-test.sh "$GITHUB_WORKSPACE/release-test"
      - name: Summary
        if: always()
        run: |
          {
            echo '## Released jar in a real Fabric install'
            echo '```'
            cat release-test/driver.log 2>/dev/null || echo 'no driver log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: |
            ${{ github.workspace }}/release-test/
            !${{ github.workspace }}/release-test/game/
          retention-days: 7

  # Jars that passed every job are committed to the jars branch, so they can be
  # fetched with git (artifact storage is not reachable from every machine).
  publish:
    name: Publish tested jars
    needs: [build, minecraft, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-jar-*
          path: tested
          merge-multiple: true
      - name: Commit to the jars branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q pub && cd pub
          git config user.name utaib
          git config user.email utaib092008@gmail.com
          git remote add origin "https://x-access-token:$TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin jars; then git checkout -q -b jars FETCH_HEAD; else git checkout -q --orphan jars; fi
          for jar in ../tested/*.jar; do
            name=$(basename "$jar")
            cp "$jar" "$name"
            echo "$name $(sha256sum "$name" | cut -d' ' -f1) source ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}" >> tested.txt
          done
          git add -A
          git commit -q -m "Tested jars from run ${GITHUB_RUN_ID} (source ${GITHUB_SHA::7})"
          git push -q origin HEAD:jars
          cat tested.txt
