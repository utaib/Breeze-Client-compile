name: Breeze mod build and test

# One-off API dump on branch tools-dn (the display name, TNT timers and
# name tags): the signatures of the classes in scripts/ci/api-classes.txt
# for each version asked for, printed gzipped and base64-encoded. Nothing is
# built for players. The branch is emptied after the run.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated Minecraft versions
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          ONLY: ${{ inputs.versions }}
        run: echo "matrix=$(scripts/ci/versions-matrix.sh "$ONLY")" >> "$GITHUB_OUTPUT"

  dump:
    name: API of ${{ matrix.v.mc }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -q -Pbreeze_versions="${{ matrix.v.mc }}" ":versions:${{ matrix.v.mc }}:dumpApi"
      - run: |
          f="versions/${{ matrix.v.mc }}/build/api.txt"
          wc -c "$f"
          echo "BEGIN api ${{ matrix.v.mc }}"
          gzip -9c "$f" | base64 -w 4000
          echo "END api ${{ matrix.v.mc }}"
