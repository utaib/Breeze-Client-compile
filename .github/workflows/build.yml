name: Breeze mod build and test

# Build server for the Breeze Minecraft mod. The private repository
# (utaib/Breeze-Client, Breeze-Mod-New/) is the source of truth; this copy
# exists so Actions runs free on a public repository.
#
# For every version project (versions/*/gradle.properties):
#   build    the source ZIP for that version, extracted and built on its own
#   release  that exact jar in a real Fabric install, driven with X11 input
#   publish  jars that passed both, committed to the jars branch
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated Minecraft versions (empty for all)
        default: ''

concurrency:
  group: breeze-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          m=$(scripts/ci/versions-matrix.sh "${{ inputs.versions }}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | jq -r '.[] | "\(.mc)  java \(.java)  fabric-api \(.fabric_api)  mcef \(if .mcef == "" then "none" else .mcef end)"'

  frontend:
    name: Interface (types, unit, browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/check-version.sh
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - name: Browsers (Playwright Chromium, and Chrome 116 as embedded by MCEF)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          curl -sSfL -o "$RUNNER_TEMP/c116.zip" https://storage.googleapis.com/chrome-for-testing-public/116.0.5845.96/linux64/chrome-linux64.zip
          unzip -q "$RUNNER_TEMP/c116.zip" -d "$RUNNER_TEMP/c116"
          echo "CHROME116=$RUNNER_TEMP/c116/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - run: npx playwright test --reporter=line
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # Builds from the version's release source ZIP rather than the checkout, so
  # one build proves both the code and the ZIP. Extracted under a path with
  # spaces.
  build:
    name: Build ${{ matrix.v.mc }} (source ZIP, JUnit, jar)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MC: ${{ matrix.v.mc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Package and extract the source ZIP
        run: |
          scripts/package-source.sh "$MC"
          mkdir -p "$RUNNER_TEMP/zip build" "$RUNNER_TEMP/out"
          cp "build/release/Breeze Mod for $MC.zip" "$RUNNER_TEMP/out/"
          unzip -q "build/release/Breeze Mod for $MC.zip" -d "$RUNNER_TEMP/zip build"
          echo "SRC=$RUNNER_TEMP/zip build/Breeze Mod for $MC" >> "$GITHUB_ENV"
          unzip -p "build/release/Breeze Mod for $MC.zip" "Breeze Mod for $MC/SOURCE.txt"
      - name: Build and test the extracted source
        run: |
          cd "$SRC/frontend" && npm ci
          cd "$SRC" && ./gradlew --no-daemon :common:test ":versions:$MC:build" --stacktrace
      - name: Inspect the jar
        run: |
          jar="$SRC/versions/$MC/build/libs/$MC.jar"
          ls -la "$SRC/versions/$MC/build/libs/"
          unzip -l "$jar" | grep -E 'fabric.mod.json|assets/breeze/html/index.html|dev/breeze/bridge/Router.class|dev/breeze/web/BreezeWebScreen.class|dev/breeze/devtest/AutoTest.class'
          unzip -p "$jar" fabric.mod.json
          unzip -p "$jar" breeze.mixins.json | head -8
          cp "$jar" "$RUNNER_TEMP/out/"
          cp -r "$SRC/common/build/test-results" "$RUNNER_TEMP/out/common-test-results" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.v.mc }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.v.mc }}
          path: ${{ runner.temp }}/out/${{ matrix.v.mc }}.jar
          retention-days: 30

  # The jar players get, in a real Fabric install: vanilla Minecraft, Fabric
  # Loader and mods/ as a launcher sets them up (portablemc, with Mojang's own
  # Java for that version), so the game runs with intermediary names exactly as
  # for a player.
  release:
    name: ${{ matrix.v.mc }} jar in a real Fabric install
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MC: ${{ matrix.v.mc }}
      LOADER: ${{ matrix.v.loader }}
      FABRIC_API: ${{ matrix.v.fabric_api }}
      MCEF: ${{ matrix.v.mcef }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.v.mc }}
          path: dist
      - name: Display, input and capture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb openbox xdotool imagemagick ffmpeg mesa-utils x11-utils libnss3 libgbm1 libxkbcommon0 jq
          pipx install "portablemc<5"
      - name: Other mods (Fabric API from Fabric's Maven, MCEF from Modrinth where it exists)
        run: |
          mkdir -p "$RUNNER_TEMP/mods"
          enc=${FABRIC_API//+/%2B}
          curl -sSfL -o "$RUNNER_TEMP/mods/fabric-api-$FABRIC_API.jar" "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$enc/fabric-api-$enc.jar"
          if [ -n "$MCEF" ]; then
            curl -sSfL -o "$RUNNER_TEMP/mods/mcef-$MCEF.jar" "https://api.modrinth.com/maven/maven/modrinth/mcef/$MCEF/mcef-$MCEF.jar"
          fi
          ls -la "$RUNNER_TEMP/mods" dist
      - name: Launch, drive and check
        run: |
          BREEZE_LAUNCH=prod BREEZE_MC="$MC" BREEZE_LOADER="$LOADER" \
          BREEZE_JAR="dist/$MC.jar" BREEZE_MODS="$RUNNER_TEMP/mods" \
            scripts/ci/run-minecraft-test.sh "$GITHUB_WORKSPACE/release-test"
      - name: Summary
        if: always()
        run: |
          {
            echo "## $MC jar in a real Fabric install"
            echo '```'
            cat release-test/driver.log 2>/dev/null || echo 'no driver log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.v.mc }}
          path: |
            ${{ github.workspace }}/release-test/
            !${{ github.workspace }}/release-test/game/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tested-${{ matrix.v.mc }}
          path: dist/${{ matrix.v.mc }}.jar
          retention-days: 30

  # Jars that passed their real-install test are committed to the jars branch,
  # so they can be fetched with git (artifact storage is not reachable from
  # every machine). A version that failed publishes nothing.
  publish:
    name: Publish tested jars
    needs: [release, frontend]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-*
          path: tested
          merge-multiple: true
      - name: Commit to the jars branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          ls tested/*.jar >/dev/null 2>&1 || { echo "no version passed; nothing to publish"; exit 0; }
          git init -q pub && cd pub
          git config user.name utaib
          git config user.email utaib092008@gmail.com
          git remote add origin "https://x-access-token:$TOKEN@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin jars; then git checkout -q -b jars FETCH_HEAD; else git checkout -q --orphan jars; fi
          touch tested.txt
          for jar in ../tested/*.jar; do
            name=$(basename "$jar")
            cp "$jar" "$name"
            grep -v "^$name " tested.txt > tested.new || true
            echo "$name $(sha256sum "$name" | cut -d' ' -f1) source ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}" >> tested.new
            sort -V tested.new > tested.txt && rm tested.new
          done
          git add -A
          git commit -q -m "Tested jars from run ${GITHUB_RUN_ID} (source ${GITHUB_SHA::7})"
          git push -q origin HEAD:jars
          cat tested.txt
