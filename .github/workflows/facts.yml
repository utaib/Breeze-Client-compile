name: Which Sodium the launcher picks
on: push
permissions:
  contents: read
jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sodium, Lithium and the rest per Minecraft version, as the launcher orders them
        run: |
          set -u
          MC='1.17 1.17.1 1.18 1.18.1 1.18.2 1.19 1.19.1 1.19.2 1.19.3 1.19.4 1.20 1.20.1 1.20.2 1.20.3 1.20.4 1.20.5 1.20.6 1.21 1.21.1 1.21.2 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.9 1.21.10 1.21.11 26.1 26.1.1 26.1.2 26.2 26.3'
          for slug in sodium lithium immediatelyfast entityculling ferrite-core badoptimizations modernfix; do
            curl -s -A 'breeze-build-facts' "https://api.modrinth.com/v2/project/$slug/version?include_changelog=false&loaders=%5B%22fabric%22%5D" -o v.json
            echo "## $slug ($(jq length v.json) fabric versions)"
            for mc in $MC; do
              # The launcher's order: releases before betas before alphas, featured first within each, then newest.
              jq -r --arg mc "$mc" '
                [ .[] | select(.game_versions | index($mc)) ] as $all
                | ($all | map(select(.version_type=="release")) ) as $rel
                | ($all | sort_by((if .version_type=="release" then 0 elif .version_type=="beta" then 1 else 2 end), (if .featured then 0 else 1 end)) | .[0]) as $pick
                | ($all | sort_by(.date_published) | reverse | .[0]) as $newest
                | ($rel | sort_by(.date_published) | reverse | .[0]) as $newrel
                | if ($all|length)==0 then "   \($mc): none"
                  else "   \($mc): picks \($pick.version_number) (\($pick.version_type)\(if $pick.featured then ", featured" else "" end), \($pick.date_published[0:10])); newest release \($newrel.version_number // "none") (\(($newrel.date_published // "")[0:10])); newest of all \($newest.version_number) (\($newest.version_type))"
                  end' v.json
            done
          done
