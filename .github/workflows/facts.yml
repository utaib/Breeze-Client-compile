name: Forge MDK build files
on: push
permissions:
  contents: read
jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Forge's own example build files (1.20.4, 1.20.6, 26.3)
        run: |
          for fv in 1.20.4-49.2.13 1.20.6-50.2.14 26.3-66.1.8; do
            curl -s -o mdk.zip "https://maven.minecraftforge.net/net/minecraftforge/forge/$fv/forge-$fv-mdk.zip"
            echo "=================== $fv settings.gradle"; unzip -p mdk.zip settings.gradle | grep -vE '^\s*//|^\s*$'
            echo "=================== $fv build.gradle"; unzip -p mdk.zip build.gradle | grep -vE '^\s*//|^\s*$' | grep -vE '^\s*\*|/\*\*' | head -120
            echo "=================== $fv gradle.properties"; unzip -p mdk.zip gradle.properties | grep -vE '^\s*#|^\s*$' | head -30
            unzip -p mdk.zip gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          done
