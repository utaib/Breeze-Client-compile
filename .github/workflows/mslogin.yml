name: Admin panel deploy check
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Does the live admin panel serve the new sign-in?
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            n=$(curl -s "https://admin.breezeclient.net/assets/js/auth.js?check=$i$RANDOM" | grep -c 'oauth20_remoteconnect.srf?otc=' || true)
            echo "try $i: lines with the prefilled Microsoft page: $n"
            if [ "$n" -gt 0 ]; then echo "::notice title=admin-deploy::live admin panel serves the new sign-in"; exit 0; fi
            sleep 30
          done
          echo "::error title=admin-deploy::the live admin panel still serves the old sign-in"
          exit 1
