name: Probe the live store
# One-off: response headers of a public cape image. Reads public URLs only.
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          url=$(curl -s --max-time 20 https://api.breezeclient.net/capes | python3 -c 'import sys,json; print(json.load(sys.stdin)["capes"][0]["image_url"])')
          h=$(curl -s -o /dev/null -D - --max-time 20 -H 'Origin: https://breezeclient.net' "$url" | tr -d '\r' | grep -iE '^(cross-origin|access-control|content-type|content-security)' | tr '\n' ' ')
          echo "::notice title=cape image headers::$h"
          h2=$(curl -s -o /dev/null -D - --max-time 20 https://api.breezeclient.net/capes | tr -d '\r' | grep -iE '^cross-origin' | tr '\n' ' ')
          echo "::notice title=api headers::$h2"
