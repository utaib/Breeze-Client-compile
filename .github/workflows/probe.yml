name: Probe what Google's servers get from breezeclient.net
# One-off: Google PageSpeed Insights loads the page from Google's own machines.
# If Cloudflare challenges those, the document comes back 403 "Just a moment...".
# Public URLs only.
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: |
          set +e
          for page in "https://breezeclient.net/" "https://breezeclient.net/docs/"; do
            enc=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$page")
            code=$(curl -s -o psi.json -w '%{http_code}' --max-time 180 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$enc&strategy=desktop&category=seo")
            out=$(python3 - <<'EOF'
          import json
          try:
              d = json.load(open('psi.json'))
          except Exception as e:
              print('no json', e); raise SystemExit
          if 'error' in d:
              print('error', json.dumps(d['error'])[:300]); raise SystemExit
          lr = d.get('lighthouseResult', {})
          a = lr.get('audits', {})
          doc = None
          for item in (a.get('network-requests', {}).get('details', {}) or {}).get('items', [])[:3]:
              if item.get('resourceType') == 'Document':
                  doc = item.get('statusCode'); break
          title = a.get('document-title', {}).get('score')
          http = a.get('http-status-code', {}).get('score')
          crawl = a.get('is-crawlable', {}).get('score')
          print(f"final={lr.get('finalDisplayedUrl')} doc_status={doc} http_status_ok={http} crawlable={crawl} seo={lr.get('categories',{}).get('seo',{}).get('score')} warnings={lr.get('runWarnings')}")
          EOF
          )
            echo "::notice title=$page (PSI $code)::$out"
          done
