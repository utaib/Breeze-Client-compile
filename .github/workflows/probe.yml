name: Rinku mouse probe

# One-off: how Rinku's browser turns a mouse button number into a
# Chromium click, per build. Prints bytecode only; builds nothing.
on:
  push:
    branches: [tools]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: |
          for b in 3.0.5-26.3-fabric 3.0.4-26.2-fabric; do
            echo "=================== rinku $b"
            rm -rf x && mkdir x
            curl -sSfL -o rinku.jar "https://api.modrinth.com/maven/maven/modrinth/rinku/$b/rinku-$b.jar"
            (cd x && unzip -q ../rinku.jar)
            grep -rl --include='*.class' -e sendMousePress -e MOUSE_BUTTON x | sort | while read -r c; do
              echo "--- $c"
              javap -c -p -constants "$c" | awk '/(sendMouse(Press|Release|Move)|mouse[A-Z][A-Za-z]*|onMouse[A-Za-z]*|[Bb]utton[A-Za-z]*)\(/{p=1} p{print} /^$/{p=0}' | head -400
            done
          done
