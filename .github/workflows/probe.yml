name: API probe

# Prints the public signatures of Minecraft classes for one version, for
# porting (gradle/version.gradle, printApi).
on:
  workflow_dispatch:
    inputs:
      mc:
        description: Minecraft version (a versions/ folder)
        required: true
      classes:
        description: Comma-separated class names
        required: true

permissions:
  contents: read

jobs:
  probe:
    name: API of ${{ inputs.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon -q -Pbreeze_versions="${{ inputs.mc }}" ":versions:${{ inputs.mc }}:printApi" -Pclasses="${{ inputs.classes }}"
