name: Probe the sitemap
# One-off: how breezeclient.net serves /sitemap.xml. Public URLs only.
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "curl/8"; do
            for path in /sitemap.xml /robots.txt; do
              r=$(curl -s -o b.txt -D h.txt --max-time 20 -A "$ua" -w '%{http_code} %{content_type} %{size_download}' "https://breezeclient.net$path")
              mit=$(tr -d '\r' < h.txt | grep -i '^cf-mitigated' | cut -d' ' -f2)
              echo "::notice title=${ua:0:20} $path::$r ${mit:+mitigated=$mit} $(head -c 90 b.txt | tr '\n' ' ')"
            done
          done
