name: Probe the store against the live API
# One-off: do capes draw when the store runs as breezeclient.net against the
# live API? The pages are served from the Cloudflare Pages deployments (old =
# production, new = the branch preview), everything else is the real network.
# Reads public URLs only.
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The store in a browser
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const sources = { live: 'https://breezeclient.pages.dev' };
          for (const [label, src] of Object.entries(sources)) {
            const ctx = await b.newContext({ viewport: { width: 1280, height: 900 } });
            const p = await ctx.newPage();
            const errs = [], imgs = [], bad = [];
            p.on('console', (m) => { if (m.type() === 'error') errs.push(m.text().slice(0, 140)); });
            p.on('pageerror', (e) => errs.push('pageerror: ' + String(e).slice(0, 140)));
            p.on('requestfailed', (r) => { if (/assets\/capes/.test(r.url())) bad.push((r.failure() || {}).errorText + ' ' + r.url().slice(-40)); });
            p.on('response', (r) => { if (/assets\/capes/.test(r.url())) imgs.push(r.status() + ' ' + r.request().headers()['sec-fetch-mode'] + ' corp=' + r.headers()['cross-origin-resource-policy']); });
            await p.route(/^https:\/\/breezeclient\.net\//, async (route) => {
              const u = new URL(route.request().url());
              const res = await fetch(src + u.pathname + u.search);
              const body = Buffer.from(await res.arrayBuffer());
              route.fulfill({ status: res.status, body, headers: { 'content-type': res.headers.get('content-type') || 'text/html' } });
            });
            await p.goto('https://breezeclient.net/store', { waitUntil: 'load' }).catch((e) => errs.push('goto: ' + e.message));
            await p.waitForTimeout(6000);
            const s = await p.evaluate(() => ({
              title: document.title,
              cards: document.querySelectorAll('.cape-card').length,
              canvases: document.querySelectorAll('canvas.cape-face').length,
              painted: [...document.querySelectorAll('canvas.cape-face')].filter((c) => c.width === 120 && c.style.opacity === '1').length,
              hidden: [...document.querySelectorAll('canvas.cape-face')].filter((c) => c.style.display === 'none').length,
            }));
            console.log(`::notice title=${label} store::${JSON.stringify(s)}`);
            console.log(`::notice title=${label} cape images::${imgs.slice(0, 4).join(' | ') || 'none'}`);
            console.log(`::notice title=${label} blocked images::${bad.slice(0, 4).join(' | ') || 'none'}`);
            console.log(`::notice title=${label} console errors::${errs.slice(0, 4).join(' | ') || 'none'}`);
            await ctx.close();
          }
          await b.close();
          EOF
          node probe.mjs
