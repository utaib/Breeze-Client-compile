name: Launcher loaders, live

# Each mod loader the launcher can install (Fabric, Quilt, Forge, NeoForge,
# and the game alone) installed the way a launch installs it, and the real
# game started with the launch's own command line, on a virtual display.
# When the push names a branch of Breeze's Forge and NeoForge jars
# (launcher/BREEZE_MODS.txt, push.sh --loaders with BREEZE_MODS_BRANCH),
# those loaders start with Breeze in their mods folder and must show that
# Breeze started.
# Runs here because the private repository's Actions are blocked and its own
# machines cannot reach Mojang or the loaders' repositories.
#
# As with launcher.yml, the launcher source is never this branch's tip: it is
# in the commit before the one that runs (HEAD~1) and every job restores
# launcher/ from there. Nothing is cached, kept or published. The branch is
# emptied to a README when the run has been read.
on:
  push:
    branches: [launcher-loaders]

permissions:
  contents: read

concurrency:
  group: launcher-loaders
  cancel-in-progress: true

jobs:
  linux:
    name: Install and start (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      BREEZE_LIVE_HOME: ${{ github.workspace }}/live-home
      TAURI: launcher/breeze launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore the launcher source from the commit before this one
        run: git checkout -q HEAD~1 -- launcher

      - name: Breeze's own Forge and NeoForge jars, when the push names them
        shell: bash
        run: |
          f="launcher/BREEZE_MODS.txt"
          [ -f "$f" ] || { echo "no Breeze jars named; the loaders start without Breeze"; exit 0; }
          branch=$(head -1 "$f" | tr -d '\r')
          git fetch -q --depth 1 origin "+refs/heads/$branch:refs/remotes/origin/breeze-mods"
          mkdir -p "$RUNNER_TEMP/breeze-mods"
          git archive origin/breeze-mods | tar -x -C "$RUNNER_TEMP/breeze-mods"
          ls -la "$RUNNER_TEMP/breeze-mods"
          echo "BREEZE_LIVE_MODS=$RUNNER_TEMP/breeze-mods" >> "$GITHUB_ENV"
          echo "::notice title=breeze-jars::from $branch: $(cd "$RUNNER_TEMP/breeze-mods" && ls *.jar | tr '\n' ' ')"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev \
            xvfb mesa-utils libgl1-mesa-dri libopenal1

      # The Rust build only needs the folder to exist; the tests open no window.
      - name: A place for the front end
        run: mkdir -p "launcher/breeze launcher/dist" && echo '<!doctype html><title>Breeze</title>' > "launcher/breeze launcher/dist/index.html"

      - name: Build the tests
        working-directory: ${{ env.TAURI }}
        run: cargo test --lib --no-run 2>&1 | tail -n 5

      - name: Unit tests
        working-directory: ${{ env.TAURI }}
        run: |
          cargo test --lib 2>&1 | tee "$RUNNER_TEMP/unit.log" | tail -n 6
          test "${PIPESTATUS[0]}" -eq 0
          echo "::notice title=unit-tests::$(grep -E '^test result' "$RUNNER_TEMP/unit.log" | tail -n 1)"

      - name: The builds each loader lists
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: |
          cargo test --lib -- --ignored --nocapture live_loader_builds 2>&1 | tee "$RUNNER_TEMP/builds.log"
          rc=${PIPESTATUS[0]}
          grep -E ' for [0-9.]+: |NeoForge (lists|families)' "$RUNNER_TEMP/builds.log" | while read -r line; do echo "::notice title=builds::$line"; done
          exit "$rc"

      - name: Minecraft alone starts
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh vanilla

      - name: Fabric starts
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh fabric

      - name: Quilt starts
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh quilt

      - name: Forge installs and starts
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh forge

      - name: NeoForge installs and starts
        if: ${{ !cancelled() }}
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh neoforge

  # Windows is where most players are: the installers' Java steps, the class
  # path with its semicolons and the copied game jar are run there. The runner
  # has no graphics card the game accepts, so the game itself is not started.
  windows:
    name: Install (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      BREEZE_LIVE_HOME: ${{ github.workspace }}\live-home
      BREEZE_LIVE_NO_START: "1"
      TAURI: launcher/breeze launcher/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore the launcher source from the commit before this one
        shell: bash
        run: git checkout -q HEAD~1 -- launcher
      - name: Breeze's own Forge and NeoForge jars, when the push names them
        shell: bash
        run: |
          f="launcher/BREEZE_MODS.txt"
          [ -f "$f" ] || { echo "no Breeze jars named; the loaders start without Breeze"; exit 0; }
          branch=$(head -1 "$f" | tr -d '\r')
          git fetch -q --depth 1 origin "+refs/heads/$branch:refs/remotes/origin/breeze-mods"
          mkdir -p "$RUNNER_TEMP/breeze-mods"
          git archive origin/breeze-mods | tar -x -C "$RUNNER_TEMP/breeze-mods"
          ls -la "$RUNNER_TEMP/breeze-mods"
          echo "BREEZE_LIVE_MODS=$RUNNER_TEMP/breeze-mods" >> "$GITHUB_ENV"
          echo "::notice title=breeze-jars::from $branch: $(cd "$RUNNER_TEMP/breeze-mods" && ls *.jar | tr '\n' ' ')"
      - uses: dtolnay/rust-toolchain@stable
      - name: A place for the front end
        shell: bash
        run: mkdir -p "launcher/breeze launcher/dist" && echo '<!doctype html><title>Breeze</title>' > "launcher/breeze launcher/dist/index.html"
      - name: Build the tests
        shell: bash
        working-directory: ${{ env.TAURI }}
        run: cargo test --lib --no-run 2>&1 | tail -n 5
      - name: Forge installs
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh forge
      - name: NeoForge installs
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh neoforge
      - name: Quilt resolves
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: ${{ env.TAURI }}
        run: ../scripts/live-loader.sh quilt
